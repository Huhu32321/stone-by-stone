# Solved versions of the `stonetwin` environment (2026-11-14, Windows x64, RTX 50-series).
#   conda env create -f environment.yml
#   set SAM2_BUILD_CUDA=0 before creating, so SAM 2 skips its optional CUDA extension.
# PyTorch comes from the CUDA 12.8 wheel index: needed for compute capability 12.0.
# The SAM 2.1 checkpoint is downloaded separately into checkpoints/ (see README).
name: stonetwin
channels:
  - conda-forge
dependencies:
  - python=3.11.18
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - numpy==2.4.6
      - scipy==1.17.1
      - open3d==0.20.0
      - opencv-python==5.0.0.93
      - scikit-image==0.26.0
      - shapely==2.2.0
      - pillow==13.0.0
      - matplotlib==3.11.2
      - pandas==3.1.1
      - typer==0.29.1
      - pyyaml==6.0.3
      - pycolmap==4.2.1
      - lpips==0.1.4
      - hydra-core==1.3.8
      - iopath==0.1.10
      - tqdm==4.70.1
      - pytest==9.2.0
      - ruff==0.17.5
      - git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec
      - -e .
