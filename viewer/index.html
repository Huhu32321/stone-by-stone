<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stone by Stone</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%271%27 y=%274%27 width=%2714%27 height=%278%27 rx=%272%27 fill=%27%23b5651d%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <aside id="panel">
      <h1>Stone by Stone</h1>
      <label>Scene <select id="scene"></select></label>
      <label>Colour
        <select id="mode">
          <option value="0">RGB</option>
          <option value="1">Stone ID</option>
          <option value="2">Attribute</option>
        </select>
      </label>
      <label id="attr-row">Attribute <select id="attr"></select></label>
      <div id="legend" hidden>
        <div id="legend-bar"></div>
        <div id="legend-range"><span id="legend-min"></span><span id="legend-max"></span></div>
      </div>
      <label>Point size <input id="size" type="range" min="0.5" max="6" step="0.25" value="1.5" /></label>
      <p id="status" class="muted">Loading…</p>
      <p class="muted small">Drag to orbit, right-drag to pan, scroll to zoom. Click a stone.</p>
    </aside>
    <section id="card" hidden></section>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
