# Defaults shared by all scenes. Scene files in configs/scenes/ override these.
# Every value here is a starting point: change it, then log why in docs/DECISIONS.md.
seed: 0

tools:                             # machine-local paths go in configs/local.yaml
  colmap: null
  lichtfeld: null
  sam2_checkpoint: checkpoints/sam2.1_hiera_large.pt

ingest:
  blur_metric: laplacian_variance
  blur_reject_percentile: 5        # flag the blurriest N% (flag, never delete)
  strip_exif_on_publish: true      # GPS + camera serial must not reach git

sfm:
  camera_model: OPENCV
  single_camera: true              # one body, fixed 24 mm, fixed resolution
  matcher: exhaustive
  max_num_features: 8192           # SIFT features per image (COLMAP default)
  accept:
    min_registered_fraction: 0.90
    max_mean_reproj_error_px: 1.0

dense:
  backend: auto                    # colmap_mvs if CUDA build present, else splat_depth_fusion
  voxel_downsample_m: 0.003        # applied only when the scene is metric
  max_image_size: 1600             # px, longest side for undistortion and PatchMatch (D-012)
  fusion_min_num_pixels: 3         # stereo_fusion: views that must agree (COLMAP default 5)
  fusion_max_reproj_error_px: 2.0  # COLMAP default
  fusion_max_depth_error: 0.01     # relative; COLMAP default
  fusion_max_normal_error_deg: 10  # COLMAP default

splat:
  backend: auto                    # decided in M0, see TECH_SPEC section 5
  holdout_every: 8                 # every 8th image is test-only
  iterations: 30000                # LichtFeld evaluates at 7000 and at the last step
  max_image_size: 1600             # px, longest side of the undistorted training images
  max_gaussians: 3000000           # --max-cap; keeps VRAM under 12 GB
  lpips_net: vgg                   # LPIPS backbone, as in the original 3DGS evaluation

frame:
  plane_ransac_threshold: 0.01     # in scene units before scaling
  require_metric: false            # pipeline runs without scale refs, but flags it
  min_inlier_fraction: 0.3         # fail if the dominant plane explains less of the cloud
  roi_band_front: 0.15             # scene units in front of the plane kept (relief, plaques)
  roi_band_back: 0.4               # scene units behind the plane kept (cavity, recesses)
  roi_image_fraction: 0.8          # central fraction of each image whose footprint bounds the ROI

register:
  split: odd_even                  # two independent reconstructions from disjoint images
  coarse: fpfh_ransac
  fine: icp_point_to_plane
  estimate_scale: true
  # Lengths below are in normalised units: each cloud is divided by its median radius.
  voxel: 0.01                      # downsampling for FPFH + RANSAC
  normal_radius_factor: 2.5        # x voxel
  fpfh_radius_factor: 5            # x voxel
  ransac_distance_factor: 1.5      # x voxel
  ransac_max_iterations: 1000000
  ransac_confidence: 0.9999
  icp_voxel: 0.004                 # downsampling for ICP
  icp_max_distance_factor: 2.5     # x icp_voxel
  icp_max_iterations: 200          # joint 7-DoF point-to-plane steps (D-015)
  converge_scale: 1.0e-5           # stop when a step changes scale by less than this
  converge_rot_deg: 1.0e-3         # ... and rotation by less than this

segment:
  methods: [ortho, multiview]      # ortho = guaranteed baseline, multiview = main method
  ortho_gsd_m: 0.002               # orthophoto ground sampling distance
  min_stone_area_m2: 0.002
  max_stone_area_m2: 1.0
  multiview_affinity_threshold: 0.5
  contain_frac: 0.9                # a mask containing >= 90 % of a smaller one is dropped
  ortho_hole_close_px: 11          # closing size for the orthophoto coverage mask
  nonmetric:                       # used while transform.json says metric: false (D-016)
    ortho_gsd: 0.004               # scene units per pixel (~ half the point spacing)
    min_stone_area: 0.008          # scene units^2 (about 0.09 x 0.09)
    max_stone_area: 4.0            # scene units^2
  multiview:
    depth_rel_tol: 0.02            # point kept in a view if |z - depth| <= 2 % of depth
    min_mask_px: 400               # per-image masks smaller than this are ignored
    max_mask_frac: 0.15            # ... and masks larger than this fraction of the image
    graph_point_fraction: 0.2      # points sampled to count mask-pair intersections
    min_edge_points: 20            # sampled shared points needed for an edge
    min_cluster_masks: 2           # a stone must be seen as a mask in >= 2 images
    min_votes: 2                   # a point needs >= 2 agreeing observations
    min_vote_frac: 0.4             # ... and >= 40 % of the views that see it
    n_debug_views: 6
    sam:                           # overrides of segment.sam for the 1600 px photos
      points_per_side: 32
      crop_n_layers: 0
  sam:                             # SAM2AutomaticMaskGenerator arguments (D-010)
    points_per_side: 48
    points_per_batch: 64
    pred_iou_thresh: 0.8
    stability_score_thresh: 0.9
    box_nms_thresh: 0.7
    crop_n_layers: 1               # extra 2x2 crops find small stones on a large image
    crop_n_points_downscale_factor: 1
    min_mask_region_area: 0

attributes:
  method: multiview                # chosen at Gate 2 (D-017); ortho stays runnable
  min_points: 50                   # stones with fewer supporting points are skipped
  footprint_close_px: 5            # closing (at the ortho GSD) before the concave hull
  recession_neighbours: 6          # minimum number of neighbour stones
  recession_radius_m: 0.75         # neighbour radius when metric; must exceed recess size
  nonmetric:
    recession_radius: 1.5          # scene units; the cavity is about 1.0 x 1.5 (D-018)

evaluate:
  min_gt_stones: 30
  iou_match_threshold: 0.5
  iou_sweep: [0.3, 0.5, 0.7]       # extra F1 values, reported for information only
  cover_frac: 0.5                  # "mostly inside" for over-/under-segmentation counts
  region_close_px: 41              # closing for the derived region (~2-3 joint widths, D-017)

viewer:
  max_points: 1500000
  max_payload_mb: 30
  outline_tolerance_px: 1.5        # outline simplification, in ortho GSD pixels
