<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5651d"/></marker><marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b6ea8"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="60" y="72" font-size="34" fill="#1f2328" font-weight="600" text-anchor="start">Wall coordinate frame</text><text x="60" y="110" font-size="20" fill="#57606a" text-anchor="start">From an arbitrary SfM gauge to a frame where z means &#x27;proud of&#x27; or &#x27;set back from&#x27; the wall</text><polygon points="140,670 700,670 800,290 240,290" fill="#fbefe3" stroke="#b5651d" stroke-width="2"/><text x="250" y="330" font-size="18" fill="#b5651d" font-weight="600" text-anchor="start">fitted wall plane</text><text x="250" y="356" font-size="18" fill="#b5651d" text-anchor="start">RANSAC + least squares</text><path d="M470 520 L720 520" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#arr)"/><path d="M470 520 L536 270" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#arr)"/><path d="M470 520 L320 750" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#arr)"/><text x="595" y="504" font-size="20" fill="#1f2328" font-weight="600" text-anchor="middle">x  along the wall</text><text x="550" y="262" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">y  up</text><text x="320" y="782" font-size="20" fill="#1f2328" font-weight="600" text-anchor="middle">z  out, toward the cameras</text><circle cx="470" cy="520" r="6" fill="#1f2328"/><text x="484" y="548" font-size="16" fill="#57606a" text-anchor="start">origin: inlier centroid</text><text x="960" y="200" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start">How each axis is defined</text><text x="960" y="240" font-size="18" fill="#1f2328" text-anchor="start">• z: plane normal, flipped to face the mean camera position.</text><text x="960" y="278" font-size="18" fill="#1f2328" text-anchor="start">• y: mean camera &#x27;up&#x27; direction, projected into the plane.</text><text x="960" y="316" font-size="18" fill="#1f2328" text-anchor="start">• x: y × z, so the frame is right-handed.</text><text x="960" y="354" font-size="18" fill="#1f2328" text-anchor="start">• Scale 1: lengths stay in relative scene units.</text><text x="960" y="420" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start">Region of interest</text><text x="960" y="458" font-size="18" fill="#1f2328" text-anchor="start">• A band around the plane, wide enough behind it</text><text x="960" y="486" font-size="18" fill="#1f2328" text-anchor="start">  for the open cavity.</text><text x="960" y="520" font-size="18" fill="#1f2328" text-anchor="start">• Inside the hull where the central 80 % of each</text><text x="960" y="548" font-size="18" fill="#1f2328" text-anchor="start">  photo meets the plane.</text><text x="960" y="610" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start">This run</text><text x="960" y="648" font-size="18" fill="#1f2328" text-anchor="start">• 2,091,844 points kept in the wall region</text><text x="960" y="680" font-size="18" fill="#1f2328" text-anchor="start">• plane inlier RMS 0.0055</text><text x="960" y="712" font-size="18" fill="#1f2328" text-anchor="start">• wall region 12.6 × 9.9 units</text><text x="60" y="840" font-size="17" fill="#57606a" text-anchor="start">Every later stage (segmentation, recession, the viewer) works in this frame.</text></svg>