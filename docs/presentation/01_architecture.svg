<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5651d"/></marker><marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b6ea8"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="60" y="72" font-size="34" fill="#1f2328" font-weight="600" text-anchor="start">System architecture</text><text x="60" y="110" font-size="20" fill="#57606a" text-anchor="start">One Python package drives external engines; every stage leaves a stage.json</text><text x="60" y="168" font-size="16" fill="#57606a" font-weight="600" text-anchor="start">INPUTS</text><rect x="60" y="182" width="300" height="130" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="78" y="216" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Photographs</text><text x="78" y="244" font-size="17" fill="#57606a" text-anchor="start">highwall: 42 · entrance: 155</text><text x="78" y="269" font-size="17" fill="#57606a" text-anchor="start">Canon EOS R8, 24 mm</text><text x="78" y="294" font-size="17" fill="#57606a" text-anchor="start">read-only, never in git</text><rect x="60" y="332" width="300" height="104" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="78" y="366" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Hand annotation</text><text x="78" y="394" font-size="17" fill="#57606a" text-anchor="start">231 stone polygons</text><text x="78" y="419" font-size="17" fill="#57606a" text-anchor="start">labelme, on the orthophoto</text><rect x="60" y="456" width="300" height="104" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="78" y="490" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Configuration</text><text x="78" y="518" font-size="17" fill="#57606a" text-anchor="start">default.yaml + one file per scene</text><text x="78" y="543" font-size="17" fill="#57606a" text-anchor="start">every parameter in YAML</text><rect x="420" y="150" width="760" height="560" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="444" y="186" font-size="19" fill="#1f2328" font-weight="600" text-anchor="start">stonetwin  ·  python -m stonetwin all --scene highwall</text><rect x="444" y="206" width="346" height="116" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="462" y="240" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Reconstruct</text><text x="462" y="268" font-size="17" fill="#57606a" text-anchor="start">ingest · sfm</text><text x="462" y="293" font-size="17" fill="#57606a" text-anchor="start">dense · splat</text><rect x="806" y="206" width="346" height="116" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="824" y="240" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Frame &amp; register</text><text x="824" y="268" font-size="17" fill="#57606a" text-anchor="start">frame · register</text><rect x="444" y="338" width="346" height="116" rx="10" fill="#fbefe3" stroke="#b5651d" stroke-width="2.5"/><text x="462" y="372" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Parse &amp; describe</text><text x="462" y="400" font-size="17" fill="#57606a" text-anchor="start">segment (ortho, multiview)</text><text x="462" y="425" font-size="17" fill="#57606a" text-anchor="start">attributes</text><rect x="806" y="338" width="346" height="116" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="824" y="372" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Verify &amp; deliver</text><text x="824" y="400" font-size="17" fill="#57606a" text-anchor="start">evaluate · export-viewer</text><text x="824" y="425" font-size="17" fill="#57606a" text-anchor="start">report</text><text x="444" y="488" font-size="16" fill="#57606a" text-anchor="start">Each stage reads the merged config, writes only its own folder,</text><text x="444" y="510" font-size="16" fill="#57606a" text-anchor="start">and records inputs, parameters, tool versions, time and metrics.</text><text x="444" y="552" font-size="16" fill="#57606a" font-weight="600" text-anchor="start">EXTERNAL ENGINES (called by the stages)</text><rect x="444" y="566" width="346" height="54" rx="10" fill="#eef4fb" stroke="#3b6ea8" stroke-width="1.5"/><text x="617.0" y="601.0" font-size="21" fill="#1f2328" font-weight="600" text-anchor="middle">COLMAP 4.2.1  ·  SfM, MVS (GPU)</text><rect x="806" y="566" width="346" height="54" rx="10" fill="#eef4fb" stroke="#3b6ea8" stroke-width="1.5"/><text x="979.0" y="601.0" font-size="21" fill="#1f2328" font-weight="600" text-anchor="middle">LichtFeld Studio  ·  3DGS training</text><rect x="444" y="632" width="346" height="54" rx="10" fill="#eef4fb" stroke="#3b6ea8" stroke-width="1.5"/><text x="617.0" y="667.0" font-size="21" fill="#1f2328" font-weight="600" text-anchor="middle">SAM 2.1 Hiera-L  ·  mask generation</text><rect x="806" y="632" width="346" height="54" rx="10" fill="#eef4fb" stroke="#3b6ea8" stroke-width="1.5"/><text x="979.0" y="667.0" font-size="21" fill="#1f2328" font-weight="600" text-anchor="middle">Open3D · OpenCV  ·  geometry, ICP</text><text x="1240" y="168" font-size="16" fill="#57606a" font-weight="600" text-anchor="start">OUTPUTS</text><rect x="1240" y="182" width="300" height="130" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="1258" y="216" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">outputs/&lt;scene&gt;/</text><text x="1258" y="244" font-size="17" fill="#57606a" text-anchor="start">one folder per stage</text><text x="1258" y="269" font-size="17" fill="#57606a" text-anchor="start">stage.json in each</text><text x="1258" y="294" font-size="17" fill="#57606a" text-anchor="start">metrics.json merged</text><rect x="1240" y="332" width="300" height="130" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="1258" y="366" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Generated docs</text><text x="1258" y="394" font-size="17" fill="#57606a" text-anchor="start">docs/RESULTS.md, figures</text><text x="1258" y="419" font-size="17" fill="#57606a" text-anchor="start">README results block</text><text x="1258" y="444" font-size="17" fill="#57606a" text-anchor="start">no number typed by hand</text><rect x="1240" y="482" width="300" height="130" rx="10" fill="#fbefe3" stroke="#b5651d" stroke-width="2.5"/><text x="1258" y="516" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Web viewer</text><text x="1258" y="544" font-size="17" fill="#57606a" text-anchor="start">Vite + three.js, static</text><text x="1258" y="569" font-size="17" fill="#57606a" text-anchor="start">1,500,000 points</text><text x="1258" y="594" font-size="17" fill="#57606a" text-anchor="start">16.6 MB payload</text><rect x="1240" y="632" width="300" height="78" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="1258" y="666" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">GitHub Pages</text><text x="1258" y="694" font-size="17" fill="#57606a" text-anchor="start">manual workflow</text><path d="M360 247 L420 247" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M360 384 L420 384" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M360 508 L420 508" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M1180 247 L1240 247" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M1180 397 L1240 397" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M1180 547 L1240 547" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M1390 612 L1390 632" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><text x="60" y="760" font-size="17" fill="#57606a" text-anchor="start">Privacy: raw photos, EXIF serial numbers and private notes never reach git or the viewer (automated check).</text><text x="60" y="800" font-size="17" fill="#57606a" text-anchor="start">Lengths are relative scene units: the capture contains no scale reference.</text></svg>