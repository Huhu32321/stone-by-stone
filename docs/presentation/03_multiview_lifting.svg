<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5651d"/></marker><marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b6ea8"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="60" y="72" font-size="34" fill="#1f2328" font-weight="600" text-anchor="start">Multi-view lifting: 2D masks voted into 3D stones</text><text x="60" y="110" font-size="20" fill="#57606a" text-anchor="start">Each 3D point is labelled by the photos that actually see it</text><rect x="60" y="200" width="232" height="160" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="78" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">1 · Masks</text><text x="78" y="262" font-size="17" fill="#57606a" text-anchor="start">SAM 2.1 on 40 photos</text><text x="78" y="287" font-size="17" fill="#57606a" text-anchor="start">4,602 masks</text><rect x="310" y="200" width="232" height="160" rx="10" fill="#fbefe3" stroke="#b5651d" stroke-width="2.5"/><text x="328" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">2 · Visibility</text><text x="328" y="262" font-size="17" fill="#57606a" text-anchor="start">project wall points;</text><text x="328" y="287" font-size="17" fill="#57606a" text-anchor="start">keep if MVS depth</text><text x="328" y="312" font-size="17" fill="#57606a" text-anchor="start">agrees within 2 %</text><path d="M292 280.0 L310 280.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="560" y="200" width="232" height="160" rx="10" fill="#fbefe3" stroke="#b5651d" stroke-width="2.5"/><text x="578" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">3 · Mask graph</text><text x="578" y="262" font-size="17" fill="#57606a" text-anchor="start">node = a mask&#x27;s points</text><text x="578" y="287" font-size="17" fill="#57606a" text-anchor="start">edge = IoU &gt; 0.5,</text><text x="578" y="312" font-size="17" fill="#57606a" text-anchor="start">different photos</text><path d="M542 280.0 L560 280.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="810" y="200" width="232" height="160" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="828" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">4 · Components</text><text x="828" y="262" font-size="17" fill="#57606a" text-anchor="start">connected masks</text><text x="828" y="287" font-size="17" fill="#57606a" text-anchor="start">= one stone</text><text x="828" y="312" font-size="17" fill="#57606a" text-anchor="start">12,091 edges</text><path d="M792 280.0 L810 280.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="1060" y="200" width="232" height="160" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="1078" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">5 · Point vote</text><text x="1078" y="262" font-size="17" fill="#57606a" text-anchor="start">majority of the views</text><text x="1078" y="287" font-size="17" fill="#57606a" text-anchor="start">that see the point</text><text x="1078" y="312" font-size="17" fill="#57606a" text-anchor="start">≥ 2 votes, ≥ 40 %</text><path d="M1042 280.0 L1060 280.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="1310" y="200" width="232" height="160" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="1328" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">6 · Area filter</text><text x="1328" y="262" font-size="17" fill="#57606a" text-anchor="start">footprint on the</text><text x="1328" y="287" font-size="17" fill="#57606a" text-anchor="start">wall plane</text><text x="1328" y="312" font-size="17" fill="#57606a" text-anchor="start">→ 378 stones</text><path d="M1292 280.0 L1310 280.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="430" width="1480" height="310" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="84" y="476" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start">Baseline for comparison: ortho</text><text x="84" y="512" font-size="18" fill="#57606a" text-anchor="start">Rasterise the wall cloud into one orthophoto  →  SAM 2.1 once  →  filter by area, drop masks that contain a finer one  →  map pixels back to points.</text><text x="84" y="566" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">Why multi-view wins here</text><text x="84" y="600" font-size="18" fill="#1f2328" text-anchor="start">• Points labelled: 0.50 (multiview) vs 0.33 (ortho)</text><text x="84" y="632" font-size="18" fill="#1f2328" text-anchor="start">• Recall against the annotation: 0.61 vs 0.45; F1 0.549 vs 0.470</text><text x="84" y="664" font-size="18" fill="#1f2328" text-anchor="start">• A joint that is faint in one photo is often clear in another; the orthophoto is a single, partly inpainted image.</text><text x="84" y="708" font-size="18" fill="#57606a" text-anchor="start">Known weakness: two-tone stones are split consistently across views, and SAM is class-agnostic (plaques, a door).</text></svg>