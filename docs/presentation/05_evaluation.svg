<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5651d"/></marker><marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b6ea8"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="60" y="72" font-size="34" fill="#1f2328" font-weight="600" text-anchor="start">Evaluation protocol</text><text x="60" y="110" font-size="20" fill="#57606a" text-anchor="start">The annotation is drawn once and re-registered to every run&#x27;s orthophoto</text><rect x="60" y="200" width="270" height="150" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="78" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Ground truth</text><text x="78" y="262" font-size="17" fill="#57606a" text-anchor="start">231 stones drawn by</text><text x="78" y="287" font-size="17" fill="#57606a" text-anchor="start">hand on the orthophoto</text><text x="78" y="312" font-size="17" fill="#57606a" text-anchor="start">(labelme)</text><rect x="362" y="200" width="270" height="150" rx="10" fill="#fbefe3" stroke="#b5651d" stroke-width="2.5"/><text x="380" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Re-register</text><text x="380" y="262" font-size="17" fill="#57606a" text-anchor="start">SIFT + RANSAC similarity</text><text x="380" y="287" font-size="17" fill="#57606a" text-anchor="start">6,545 inliers,</text><text x="380" y="312" font-size="17" fill="#57606a" text-anchor="start">1.17 px RMS</text><path d="M330 275.0 L362 275.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="664" y="200" width="270" height="150" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="682" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Region</text><text x="682" y="262" font-size="17" fill="#57606a" text-anchor="start">union of stones, joints</text><text x="682" y="287" font-size="17" fill="#57606a" text-anchor="start">closed; undrawn plaques,</text><text x="682" y="312" font-size="17" fill="#57606a" text-anchor="start">door, arch stay out</text><path d="M632 275.0 L664 275.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="966" y="200" width="270" height="150" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="984" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Hungarian matching</text><text x="984" y="262" font-size="17" fill="#57606a" text-anchor="start">one-to-one on IoU</text><text x="984" y="287" font-size="17" fill="#57606a" text-anchor="start">true positive at</text><text x="984" y="312" font-size="17" fill="#57606a" text-anchor="start">IoU ≥ 0.5</text><path d="M934 275.0 L966 275.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="1268" y="200" width="270" height="150" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="1286" y="234" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Scores</text><text x="1286" y="262" font-size="17" fill="#57606a" text-anchor="start">precision, recall, F1</text><text x="1286" y="287" font-size="17" fill="#57606a" text-anchor="start">mean IoU of matches</text><text x="1286" y="312" font-size="17" fill="#57606a" text-anchor="start">over- / under-segmentation</text><path d="M1236 275.0 L1268 275.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="420" width="1480" height="300" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="84" y="462" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start">Why the re-registration step exists</text><text x="84" y="506" font-size="18" fill="#1f2328" text-anchor="start">• Without an absolute scale, every SfM run has its own scale and origin, so the orthophoto grid moves between runs.</text><text x="84" y="546" font-size="18" fill="#1f2328" text-anchor="start">• Mapping polygons through wall coordinates was tried first and failed: mean IoU of matches dropped for both methods at once.</text><text x="84" y="586" font-size="18" fill="#1f2328" text-anchor="start">• A shared drop in both methods pointed at the ground truth, not the segmentation; image registration fixed it.</text><text x="84" y="626" font-size="18" fill="#1f2328" text-anchor="start">• Predictions count if at least half their area lies in the region; they are clipped to it before matching.</text><text x="84" y="688" font-size="17" fill="#57606a" text-anchor="start">Thresholds are fixed in the config; F1 at IoU 0.3 and 0.7 is reported for information only.</text></svg>