<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5651d"/></marker><marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b6ea8"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="60" y="72" font-size="34" fill="#1f2328" font-weight="600" text-anchor="start">Pipeline: 11 stages, one command</text><text x="60" y="110" font-size="20" fill="#57606a" text-anchor="start">Photos in, clickable stones and an auto-generated report out</text><rect x="60" y="170" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="78" y="204" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">0 · ingest</text><text x="78" y="232" font-size="17" fill="#57606a" text-anchor="start">EXIF, blur score</text><text x="78" y="257" font-size="17" fill="#57606a" text-anchor="start">manifest.csv</text><rect x="336" y="170" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="354" y="204" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">1 · sfm</text><text x="354" y="232" font-size="17" fill="#57606a" text-anchor="start">COLMAP camera poses</text><text x="354" y="257" font-size="17" fill="#57606a" text-anchor="start">reproj. 0.69 px</text><rect x="612" y="170" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="630" y="204" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">2 · dense</text><text x="630" y="232" font-size="17" fill="#57606a" text-anchor="start">COLMAP MVS</text><text x="630" y="257" font-size="17" fill="#57606a" text-anchor="start">2.5 M points</text><rect x="888" y="170" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="906" y="204" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">4 · frame</text><text x="906" y="232" font-size="17" fill="#57606a" text-anchor="start">wall plane (RANSAC)</text><text x="906" y="257" font-size="17" fill="#57606a" text-anchor="start">x along, y up, z out</text><rect x="1164" y="170" width="236" height="118" rx="10" fill="#fbefe3" stroke="#b5651d" stroke-width="2.5"/><text x="1182" y="204" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">6 · segment</text><text x="1182" y="232" font-size="17" fill="#57606a" text-anchor="start">ortho + multiview</text><text x="1182" y="257" font-size="17" fill="#57606a" text-anchor="start">stone ID per point</text><rect x="336" y="400" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="354" y="434" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">3 · splat</text><text x="354" y="462" font-size="17" fill="#57606a" text-anchor="start">3D Gaussian Splatting</text><text x="354" y="487" font-size="17" fill="#57606a" text-anchor="start">held-out PSNR/SSIM/LPIPS</text><rect x="612" y="400" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="630" y="434" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">5 · register</text><text x="630" y="462" font-size="17" fill="#57606a" text-anchor="start">two independent halves</text><text x="630" y="487" font-size="17" fill="#57606a" text-anchor="start">similarity + ICP</text><rect x="1164" y="400" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="1182" y="434" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">7 · attributes</text><text x="1182" y="462" font-size="17" fill="#57606a" text-anchor="start">size, roughness,</text><text x="1182" y="487" font-size="17" fill="#57606a" text-anchor="start">recession, colour</text><rect x="888" y="400" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="906" y="434" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">8 · evaluate</text><text x="906" y="462" font-size="17" fill="#57606a" text-anchor="start">vs 231 hand-drawn</text><text x="906" y="487" font-size="17" fill="#57606a" text-anchor="start">stones, Hungarian IoU</text><rect x="888" y="630" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="906" y="664" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">9 · export-viewer</text><text x="906" y="692" font-size="17" fill="#57606a" text-anchor="start">1.5 M points + stone</text><text x="906" y="717" font-size="17" fill="#57606a" text-anchor="start">records for the web</text><rect x="60" y="630" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="78" y="664" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">10 · report</text><text x="78" y="692" font-size="17" fill="#57606a" text-anchor="start">metrics.json, RESULTS,</text><text x="78" y="717" font-size="17" fill="#57606a" text-anchor="start">figures, README</text><rect x="1164" y="630" width="236" height="118" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="1182" y="664" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Ground truth</text><text x="1182" y="692" font-size="17" fill="#57606a" text-anchor="start">author&#x27;s polygons</text><text x="1182" y="717" font-size="17" fill="#57606a" text-anchor="start">on the orthophoto</text><path d="M296 229.0 L336 229.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M572 229.0 L612 229.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M848 229.0 L888 229.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M1124 229.0 L1164 229.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M454.0 288 L454.0 400" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M572 268 L652 400" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><text x="604" y="340" font-size="16" fill="#57606a" font-style="italic" text-anchor="end">split photos</text><path d="M1282.0 288 L1282.0 400" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M1164 459.0 L1124 459.0" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M1164 689.0 L1154 689.0 L1154 498 L1124 498" fill="none" stroke="#b5651d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrA)"/><path d="M1006.0 518 L1006.0 630" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M928 518 L928 574 L178.0 574 L178.0 630" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><text x="190.0" y="564" font-size="16" fill="#57606a" font-style="italic" text-anchor="start">metrics from every stage</text><text x="60" y="820" font-size="17" fill="#57606a" text-anchor="start">Every stage writes outputs/&lt;scene&gt;/&lt;NN_stage&gt;/ and a stage.json; --force recomputes, otherwise finished stages are skipped.</text></svg>