<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5651d"/></marker><marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b6ea8"/></marker></defs><rect width="1600" height="900" fill="white"/><text x="60" y="72" font-size="34" fill="#1f2328" font-weight="600" text-anchor="start">Registration experiment: two independent reconstructions</text><text x="60" y="110" font-size="20" fill="#57606a" text-anchor="start">A real similarity-estimation problem: the halves share no origin, orientation or scale</text><rect x="60" y="170" width="220" height="110" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="78" y="204" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">40 photos</text><text x="78" y="232" font-size="17" fill="#57606a" text-anchor="start">split by capture</text><text x="78" y="257" font-size="17" fill="#57606a" text-anchor="start">order: odd / even</text><rect x="340" y="150" width="260" height="110" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="358" y="184" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Half A · 20 photos</text><text x="358" y="212" font-size="17" fill="#57606a" text-anchor="start">own SfM + MVS</text><text x="358" y="237" font-size="17" fill="#57606a" text-anchor="start">own gauge</text><rect x="340" y="290" width="260" height="110" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="358" y="324" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Half B · 20 photos</text><text x="358" y="352" font-size="17" fill="#57606a" text-anchor="start">own SfM + MVS</text><text x="358" y="377" font-size="17" fill="#57606a" text-anchor="start">own gauge</text><rect x="660" y="220" width="280" height="130" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="678" y="254" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Coarse</text><text x="678" y="282" font-size="17" fill="#57606a" text-anchor="start">normalise each cloud</text><text x="678" y="307" font-size="17" fill="#57606a" text-anchor="start">FPFH features + RANSAC</text><text x="678" y="332" font-size="17" fill="#57606a" text-anchor="start">with scale (7-DoF)</text><rect x="1000" y="220" width="300" height="130" rx="10" fill="#fbefe3" stroke="#b5651d" stroke-width="2.5"/><text x="1018" y="254" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Fine</text><text x="1018" y="282" font-size="17" fill="#57606a" text-anchor="start">point-to-plane ICP, scale,</text><text x="1018" y="307" font-size="17" fill="#57606a" text-anchor="start">rotation, translation solved</text><text x="1018" y="332" font-size="17" fill="#57606a" text-anchor="start">jointly: 6 iterations</text><rect x="1360" y="220" width="180" height="130" rx="10" fill="white" stroke="#8c959f" stroke-width="1.5"/><text x="1450.0" y="254" font-size="21" fill="#1f2328" font-weight="600" text-anchor="middle">T(A←B)</text><text x="1450.0" y="282" font-size="17" fill="#57606a" text-anchor="middle">scale 1.0355</text><text x="1450.0" y="307" font-size="17" fill="#57606a" text-anchor="middle">rot. 6.87°</text><path d="M280 225 L340 205" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M280 225 L340 345" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M600 205 L660 260" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M600 345 L660 310" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M940 285 L1000 285" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><path d="M1300 285 L1360 285" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#arr)"/><rect x="340" y="470" width="260" height="110" rx="10" fill="#eef4fb" stroke="#3b6ea8" stroke-width="1.5"/><text x="358" y="504" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Full reconstruction</text><text x="358" y="532" font-size="17" fill="#57606a" text-anchor="start">all 40 cameras</text><text x="358" y="557" font-size="17" fill="#57606a" text-anchor="start">(never seen by ICP)</text><rect x="660" y="470" width="280" height="110" rx="10" fill="#eef4fb" stroke="#3b6ea8" stroke-width="1.5"/><text x="678" y="504" font-size="21" fill="#1f2328" font-weight="600" text-anchor="start">Camera-pose reference</text><text x="678" y="532" font-size="17" fill="#57606a" text-anchor="start">Umeyama on each half&#x27;s</text><text x="678" y="557" font-size="17" fill="#57606a" text-anchor="start">camera centres</text><path d="M600 525 L660 525" fill="none" stroke="#3b6ea8" stroke-width="2" marker-end="url(#arrE)"/><path d="M940 525 L1450 525 L1450 350" fill="none" stroke="#3b6ea8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrE)"/><text x="1460" y="450" font-size="16" fill="#3b6ea8" font-style="italic" text-anchor="start">compare</text><rect x="60" y="630" width="1480" height="200" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="84" y="672" font-size="22" fill="#1f2328" font-weight="600" text-anchor="start">Result vs. the camera-pose reference</text><text x="84" y="708" font-size="19" fill="#1f2328" text-anchor="start">Scale error 0.99 %   ·   rotation error 0.196°   ·   translation error 0.215 % of the scene size</text><text x="84" y="742" font-size="19" fill="#1f2328" text-anchor="start">Cloud-to-cloud in the overlap: median 0.0090, 95th pct 0.0219 (point spacing 0.0040) — relative units</text><text x="84" y="784" font-size="19" fill="#b5651d" font-weight="600" text-anchor="start">Finding: a smooth bowl a similarity cannot absorb. Holding the lens calibration fixed shrinks it below half: mostly per-half calibration.</text><text x="84" y="812" font-size="17" fill="#57606a" text-anchor="start">Caveat: one session split in two tests the estimator, not change over time.</text></svg>